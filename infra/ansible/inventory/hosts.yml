# Inventaire du lab RESILIENCE-ALPHA (VMware Workstation, LAN 10.10.10.0/24 derrière pfSense)
#
#   pfSense LAN (VMnet6) ── [ ra-ips : pont br0 ] ── VMnet12 ── ra-docker
#
all:
  children:
    control:
      hosts:
        ra-ansible:
          ansible_connection: local
    docker_hosts:
      hosts:
        ra-docker:
          ansible_host: 10.10.10.20
    # Sonde IPS en coupure ; 10.10.10.40 = interface d'administration (nic0), hors du pont
    ips_hosts:
      hosts:
        ra-ips:
          ansible_host: 10.10.10.40
    # LLM mis de côté : ra-ia éteinte, conservée pour un usage éventuel.
    # Pour la réactiver : décommenter puis lancer playbooks/30-ollama.yml
    ia_hosts:
      hosts: {}
        # ra-ia:
        #   ansible_host: 10.10.10.30
    # PC attaquant : lance la vague de charge bornée contre la plateforme (lab)
    attackers:
      hosts:
        ra-attacker:
          ansible_host: 192.168.80.50
    # pfSense : piloté en SSH (clé de ra-ansible, compte admin) via pfsensible.core
    firewalls:
      hosts:
        ra-pfsense:
          ansible_host: 10.10.10.1
          ansible_user: admin
          ansible_python_interpreter: /usr/local/bin/python3.11
