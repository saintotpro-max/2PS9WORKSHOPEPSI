---
# PRA : restauration de la base de paiement depuis une sauvegarde chiffrée.
#   ansible-playbook playbooks/71-restore.yml                          # la plus récente
#   ansible-playbook playbooks/71-restore.yml -e restore_file=payment-20261019-150000.dump.age
# Le déchiffrement se fait sur ra-ansible (seul détenteur de la clé age) ; le clair
# ne reste jamais sur disque après l'opération.
- name: Restauration de la base de paiement
  hosts: docker_hosts
  become: true
  vars_files:
    - ../roles/platform/defaults/main.yml
    - ../roles/backup/defaults/main.yml
  vars:
    restore_file: ""
    age_key_file: "{{ lookup('env', 'HOME') }}/.config/sops/age/keys.txt"
    work_dir: /tmp/pra-restore
  tasks:
    - name: Sauvegarde la plus récente
      ansible.builtin.shell: set -o pipefail; ls -1t {{ backup_dir }}/*.dump.age | head -1
      args: {executable: /bin/bash}
      register: latest
      changed_when: false
      when: restore_file | length == 0

    - name: Sauvegarde retenue
      ansible.builtin.set_fact:
        backup_path: "{{ latest.stdout if restore_file | length == 0 else backup_dir ~ '/' ~ restore_file }}"

    - name: Restauration
      block:
        - name: Récupérer la sauvegarde chiffrée sur le nœud de contrôle
          ansible.builtin.fetch:
            src: "{{ backup_path }}"
            dest: "{{ work_dir }}/backup.dump.age"
            flat: true

        - name: Déchiffrer sur le nœud de contrôle
          ansible.builtin.command: >
            age -d -i {{ age_key_file }} -o {{ work_dir }}/backup.dump {{ work_dir }}/backup.dump.age
          delegate_to: localhost
          become: false
          changed_when: true

        - name: Envoyer la sauvegarde déchiffrée (0600, temporaire)
          ansible.builtin.copy:
            src: "{{ work_dir }}/backup.dump"
            dest: "{{ work_dir }}.dump"
            mode: "0600"

        - name: Restaurer (remplace les objets existants)
          ansible.builtin.shell: >
            docker exec -i platform-db-1 pg_restore -U {{ platform_db_user }} -d {{ platform_db_name }}
            --clean --if-exists --no-owner --exit-on-error < {{ work_dir }}.dump
          changed_when: true

        - name: Résultat
          ansible.builtin.debug:
            msg: "Base {{ platform_db_name }} restaurée depuis {{ backup_path | basename }}"
      always:
        - name: Effacer le clair sur ra-docker
          ansible.builtin.file:
            path: "{{ work_dir }}.dump"
            state: absent

        - name: Effacer les copies sur le nœud de contrôle
          ansible.builtin.file:
            path: "{{ work_dir }}"
            state: absent
          delegate_to: localhost
          become: false
