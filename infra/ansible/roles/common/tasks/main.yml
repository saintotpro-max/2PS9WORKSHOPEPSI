---
# Exécuté aussi en --check : ne fait que rafraîchir l'index, sinon la simulation
# échoue sur une VM neuve (aucun paquet connu)
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  check_mode: false

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Fuseau horaire
  community.general.timezone:
    name: "{{ timezone }}"

- name: Synchronisation NTP (horodatage cohérent des journaux)
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true
