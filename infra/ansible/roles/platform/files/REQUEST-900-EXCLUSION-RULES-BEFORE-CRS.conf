# Exclusions CRS appliquées AVANT les règles (lab RESILIENCE-ALPHA).
#
# Le dashboard interroge Prometheus et Loki avec des requêtes PromQL/LogQL
# (min(...), {label="..."}) que la détection d'injection SQL/commande confond avec
# des attaques. On retire UNIQUEMENT le paramètre « query » de ces familles de règles,
# et UNIQUEMENT sur les deux relais du dashboard (déjà protégés par mot de passe).
# Toutes les autres règles continuent de s'appliquer à ces requêtes.
SecRule REQUEST_FILENAME "@rx ^/dashboard/api/(prom|loki)/" \
    "id:1000,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:query,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:query"
