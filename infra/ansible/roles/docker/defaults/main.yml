---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Rotation des journaux : évite de saturer le disque pendant une attaque
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"
  # Les conteneurs continuent de tourner si dockerd redémarre
  live-restore: true
