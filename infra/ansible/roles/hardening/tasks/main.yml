---
- name: Paquet nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# --- SSH --------------------------------------------------------------------
- name: Durcissement SSH
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger sshd

# --- Pare-feu d'entrée, avec retour arrière automatique ---------------------
- name: Règles du pare-feu d'entrée
  ansible.builtin.template:
    src: hostfw.nft.j2
    dest: /etc/hostfw.nft
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  register: hostfw_rules

- name: Service du pare-feu d'entrée
  ansible.builtin.template:
    src: hostfw.service.j2
    dest: /etc/systemd/system/hostfw.service
    mode: "0644"
  register: hostfw_unit

- name: Appliquer le pare-feu avec filet de sécurité
  when: hostfw_rules.changed or hostfw_unit.changed
  block:
    # Si l'accès est perdu, la table est supprimée automatiquement au bout de 2 min
    - name: Armer le retour arrière automatique
      ansible.builtin.command: >
        systemd-run --unit=hostfw-rollback --on-active=120
        /usr/sbin/nft delete table inet hostfw
      changed_when: true

    - name: Activer le pare-feu
      ansible.builtin.systemd_service:
        name: hostfw
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Nouvelle connexion pour vérifier l'accès
      ansible.builtin.meta: reset_connection

    - name: L'hôte reste joignable
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Désarmer le retour arrière
      ansible.builtin.systemd_service:
        name: hostfw-rollback.timer
        state: stopped

- name: Pare-feu activé au démarrage
  ansible.builtin.systemd_service:
    name: hostfw
    enabled: true
    state: started

# --- Ports publiés par Docker -------------------------------------------------
- name: Restrictions DOCKER-USER
  when: docker_user_restrict | length > 0
  block:
    - name: Script DOCKER-USER
      ansible.builtin.template:
        src: docker-user.sh.j2
        dest: /usr/local/sbin/docker-user-fw.sh
        mode: "0755"
      register: du_script

    - name: Service DOCKER-USER
      ansible.builtin.template:
        src: docker-user-fw.service.j2
        dest: /etc/systemd/system/docker-user-fw.service
        mode: "0644"
      register: du_unit

    - name: Appliquer les restrictions DOCKER-USER
      ansible.builtin.systemd_service:
        name: docker-user-fw
        state: "{{ 'restarted' if (du_script.changed or du_unit.changed) else 'started' }}"
        enabled: true
        daemon_reload: true
