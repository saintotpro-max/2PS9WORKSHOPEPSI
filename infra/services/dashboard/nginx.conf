# Dashboard RESILIENCE-ALPHA : fichiers statiques + relais en lecture seule.
# Le navigateur n'accède jamais directement à Prometheus, Loki ou au moteur de
# remédiation : seules les routes GET ci-dessous sont relayées.
server {
    listen 8080;
    server_tokens off;

    # DNS Docker, résolution à la volée (les services peuvent redémarrer)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health { access_log off; return 200 "ok\n"; }

    location /dashboard/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /dashboard/api/prom/query {
        limit_except GET { deny all; }
        set $up http://prometheus:9090;
        proxy_pass $up/api/v1/query$is_args$args;
    }
    location = /dashboard/api/prom/query_range {
        limit_except GET { deny all; }
        set $up http://prometheus:9090;
        proxy_pass $up/api/v1/query_range$is_args$args;
    }
    location = /dashboard/api/loki/query {
        limit_except GET { deny all; }
        set $up http://loki:3100;
        proxy_pass $up/loki/api/v1/query$is_args$args;
    }
    location ~ ^/dashboard/api/remediation/(events|status)$ {
        limit_except GET { deny all; }
        set $up http://remediation:8000;
        proxy_pass $up/$1$is_args$args;
    }

    location / { return 404; }
}
