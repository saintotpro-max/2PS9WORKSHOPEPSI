# Capture sur nic2, le port du pont côté serveurs : les trames transférées par le pont
# ne remontent pas sur br0, mais traversent nic2 dans les deux sens (tout le trafic de ra-docker)
ARGUS_INTERFACE=nic2
ARGUS_DAEMON=no
# Flux exposés aux clients ra, en local uniquement
ARGUS_ACCESS_PORT=561
ARGUS_BIND_IP="127.0.0.1"
# Enregistrement intermédiaire toutes les 5 s : détection pendant que le flux est ouvert
ARGUS_FLOW_STATUS_INTERVAL=5
ARGUS_MAR_STATUS_INTERVAL=60
ARGUS_GENERATE_RESPONSE_TIME_DATA=no
ARGUS_CAPTURE_DATA_LEN=0
ARGUS_SET_PID=no
